services:
  # 1. Express API Gateway
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: journeybuddy-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
    env_file:
      - ./backend/.env
    networks:
      - journeybuddy-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/telemetry || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 2. FastAPI Validation Service
  fastapi-service:
    build:
      context: ./fastapi-service
      dockerfile: Dockerfile
    container_name: journeybuddy-fastapi
    restart: unless-stopped
    ports:
      - "8000:8000"
    networks:
      - journeybuddy-network
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 3. Next.js Frontend Interface (Development Volume Mount)
  # 3. Next.js Frontend Interface (Production Container)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: journeybuddy-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - journeybuddy-network

networks:
  journeybuddy-network:
    driver: bridge