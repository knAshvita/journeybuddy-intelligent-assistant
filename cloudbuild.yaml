steps:
  # 1. Build Backend Gateway Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/journeybuddy-backend:$COMMIT_SHA'
      - '-f'
      - 'backend/Dockerfile'
      - 'backend'

  # 2. Build FastAPI Microservice Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/journeybuddy-fastapi:$COMMIT_SHA'
      - '-f'
      - 'fastapi-service/Dockerfile'
      - 'fastapi-service'

  # 3. Build Next.js Frontend Container
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/journeybuddy-frontend:$COMMIT_SHA'
      - '-f'
      - 'frontend/Dockerfile'
      - 'frontend'

  # 4. Deploy Backend Gateway to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'journeybuddy-backend'
      - '--image=gcr.io/$PROJECT_ID/journeybuddy-backend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=5000'

  # 5. Deploy FastAPI Microservice to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'journeybuddy-fastapi'
      - '--image=gcr.io/$PROJECT_ID/journeybuddy-fastapi:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8000'

  # 6. Deploy Next.js Frontend to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'journeybuddy-frontend'
      - '--image=gcr.io/$PROJECT_ID/journeybuddy-frontend:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=3000'

images:
  - 'gcr.io/$PROJECT_ID/journeybuddy-backend:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/journeybuddy-fastapi:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/journeybuddy-frontend:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY